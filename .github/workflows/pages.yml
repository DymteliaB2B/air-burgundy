# Publie le dossier web/ sur GitHub Pages à chaque push sur main (site airburgundyva.online).
# Deux jobs (modèle officiel GitHub) : l'archive est envoyée par « build » puis publiée par « deploy »,
# ce qui évite l'erreur intermittente « No artifacts named github-pages were found ».
name: Site AIR BURGUNDY
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
